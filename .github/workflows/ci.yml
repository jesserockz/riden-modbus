name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so a new modbus-connection release that breaks the supported
    # range surfaces on its own schedule, not on the next unrelated push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Ruff format
        run: uvx ruff format --check .
      - name: Ruff lint
        run: uvx ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The library declares modbus-connection>=4.12.4,<5, so verify both ends of
        # that range — consumers (e.g. Home Assistant) resolve their own version.
        include:
          - name: floor
            override: "--with modbus-connection==4.12.4"
          - name: latest
            override: ""
    name: test (modbus-connection ${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: >-
          uv run --no-sync ${{ matrix.override }}
          pytest --cov=riden_modbus --cov=script --cov-branch --cov-fail-under=100
