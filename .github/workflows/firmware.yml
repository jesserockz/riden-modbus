name: Firmware

on:
  push:
    branches: [main]
    paths:
      - esphome/**
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - esphome/**
      - .github/workflows/firmware.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build firmware
        id: esphome-build
        uses: esphome/build-action@82ec6bded4e0998e1cda757680e5f1ac85825cfd # v7.4.0
        with:
          yaml-file: esphome/rd60xx-serial-proxy.yaml
          complete-manifest: true
      - name: Assemble site
        run: |
          mkdir -p site/firmware
          mv "${{ steps.esphome-build.outputs.name }}"/* site/firmware/
          cp esphome/static/index.html site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
